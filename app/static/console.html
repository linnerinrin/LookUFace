<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台 | LookUFace</title>
    <link rel="stylesheet" href="manager.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        .console-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            max-width: 900px;
            margin: 0 auto;
        }
        .console-output {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            padding: 20px;
            border-radius: 12px;
            height: 60vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .console-output .log-timestamp { margin-right: 8px; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo" id="logo">
                <span class="logo-text">LookUFace</span>
            </div>
            <nav class="nav-menu">
                <a href="idx.html" class="nav-item">
                    <span>实时识别</span>
                </a>
                <a href="manager.html" class="nav-item">
                    <span>仓库管理</span>
                </a>
                <a href="console.html" class="nav-item active">
                    <span>控制台</span>
                </a>
                <a href="account.html" class="nav-item">
                    <span>账号管理</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle" class="sidebar-btn">
                    <span>切换主题</span>
                </button>
                <button id="loginBtn" class="sidebar-btn">
                    <span>登录账号</span>
                </button>
                <div class="status-badge" id="connectionStatus">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">加载中...</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>控制台</h1>
                <div class="header-actions">
                    <button class="btn btn-outline" onclick="clearConsole()">清空</button>
                    <button class="btn btn-outline" onclick="exportLog()">导出日志</button>
                </div>
            </header>

            <div class="console-card" style="margin-bottom: 16px;">
                <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                    <label>日期：</label>
                    <input type="date" id="filterDate" class="auth-input" style="width:auto;">
                    <label>级别：</label>
                    <select id="filterLevel" class="auth-input" style="width:auto;">
                        <option value="all">全部</option>
                        <option value="info">消息</option>
                        <option value="warn">警告</option>
                        <option value="error">错误</option>
                    </select>
                    <label>条数：</label>
                    <input type="number" id="filterLines" class="auth-input" style="width:80px;" value="100" min="10" max="1000">
                    <button class="btn btn-outline" onclick="loadHistory()">加载</button>
                </div>
            </div>

            <div class="console-card">
                <div class="card-header">
                    <span class="card-title">实时日志</span>
                    <span style="font-size:12px; color:var(--text-secondary);" id="logCount">0 条</span>
                </div>
                <div class="console-output" id="consoleOutput">
                    <span class="log-info">[系统] 控制台已就绪，等待日志...</span>
                </div>
            </div>
        </main>
    </div>

    <div id="authModal" class="modal auth-modal" style="display: none;">
        <div class="modal-content auth-content">
            <div class="modal-header">
                <h3 id="authTitle">登录账号</h3>
                <button class="modal-close" onclick="closeAuthModal()">&times;</button>
            </div>
            <div class="modal-body" id="authBody"></div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="console.js"></script>
</body>
</html>
