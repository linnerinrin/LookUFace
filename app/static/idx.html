<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>实时识别</title>
    <link rel="stylesheet" href="idx.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <nav class="nav-menu">
                <a href="idx.html" class="nav-item active">
                    <span>实时识别</span>
                </a>
                <a href="manager.html" class="nav-item">
                    <span>仓库管理</span>
                </a>
                <a href="console.html" class="nav-item">
                    <span>控制台</span>
                </a>
                <a href="account.html" class="nav-item">
                    <span>账号管理</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle" class="sidebar-btn">
                    <span>切换主题</span>
                </button>
                <button id="loginBtn" class="sidebar-btn">
                    <span>登录账号</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>实时识别</h1>
            </header>

            <!-- 双 iframe 并排 -->
            <div class="iframe-row">
                <iframe src="in.html" allow="camera; microphone"></iframe>
                <iframe src="out.html" allow="camera; microphone"></iframe>
            </div>
        </main>
    </div>

    <!-- 认证模态框 -->
    <div id="authModal" class="modal auth-modal" style="display: none;">
        <div class="modal-content auth-content">
            <div class="modal-header">
                <h3 id="authTitle">登录账号</h3>
                <button class="modal-close" onclick="closeAuthModal()">&times;</button>
            </div>
            <div class="modal-body" id="authBody"></div>
        </div>
    </div>
    <!-- 顺序要求：api.js 必须最先，auth.js 紧随其后，
         业务脚本（idx.js）最后 —— 与 manager/console/account/in/out 保持一致。
         原先 idx.js 排在 auth.js 之前，会让 auth.js 运行在业务脚本之后，
         任何对 window.LookUFace 的依赖都可能还没就绪。 -->
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="idx.js"></script>
</body>
</html>
