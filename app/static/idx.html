<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>实时识别 | LookUFace</title>
    <link rel="stylesheet" href="idx.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo" id="logo">
                <span class="logo-text">LookUFace</span>
            </div>
            <nav class="nav-menu">
                <a href="idx.html" class="nav-item active">
                    <span>实时识别</span>
                </a>
                <a href="manager.html" class="nav-item">
                    <span>仓库管理</span>
                </a>
                <a href="account.html" class="nav-item">
                    <span>账号管理</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle" class="sidebar-btn">
                    <span>切换主题</span>
                </button>
                <button id="loginBtn" class="sidebar-btn">
                    <span>登录账号</span>
                </button>
                <div class="status-badge" id="connectionStatus">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">未连接</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1>实时识别</h1>
                <div class="header-actions">
                    <button id="startBtn" class="btn btn-primary">
                        <span>开始识别</span>
                    </button>
                    <button id="stopBtn" class="btn btn-secondary" disabled>
                        <span>停止</span>
                    </button>
                </div>
            </header>

            <div class="dashboard">
                <div class="camera-card">
                    <div class="card-header">
                        <span class="card-title"> 摄像头画面</span>
                        <div class="fps-counter" id="fps">FPS: --</div>
                    </div>
                    <div class="video-container">
                        <!-- 登录遮罩层 -->
                        <div id="loginOverlay" class="login-overlay" style="display: none;">
                            <div class="login-overlay-content">
                                <p>请先登录以使用人脸识别</p>
                                <button id="overlayLoginBtn" class="btn btn-primary">立即登录</button>
                            </div>
                        </div>
                        <video id="video" autoplay playsinline muted></video>
                        <canvas id="overlayCanvas"></canvas>
                    </div>
                    <div class="camera-actions">
                        <button id="recordBtn" class="btn btn-outline" disabled>
                            <span>录制视频</span>
                        </button>
                        <div class="register-group">
                            <input type="text" id="registerName" placeholder="输入姓名" maxlength="20">
                            <button id="registerBtn" class="btn btn-success" disabled>
                                <span>注册人脸</span>
                            </button>
                        </div>
                    </div>
                    <div class="tip-text">
                        提示：注册时请确保画面中只有一个人脸，保持光线充足
                    </div>
                </div>

                <div class="results-card">
                    <div class="card-header">
                        <span class="card-title">识别结果</span>
                        <span class="stats-badge" id="resultStats" style="display: none;">
                            <span id="faceCount">0</span> 张 · <span id="processingTime">0</span>ms
                        </span>
                    </div>
                    <div id="resultContent" class="results-scroll">
                        <div class="empty-state">
                            <p>点击"开始识别"启动摄像头</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="previewModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>注册照片</h3>
                <button class="modal-close" onclick="closePreview()">&times;</button>
            </div>
            <div class="modal-body">
                <img id="modalImg" src="" alt="预览图">
                <div id="modalInfo" class="modal-info"></div>
            </div>
        </div>
    </div>

    <div id="authModal" class="modal auth-modal" style="display: none;">
        <div class="modal-content auth-content">
            <div class="modal-header">
                <h3 id="authTitle">登录账号</h3>
                <button class="modal-close" onclick="closeAuthModal()">&times;</button>
            </div>
            <div class="modal-body" id="authBody"></div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="idx.js"></script>
</body>
</html>
