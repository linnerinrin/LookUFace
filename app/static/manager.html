<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓库管理 | LookUFace</title>
    <link rel="stylesheet" href="manager.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo" id="logo">
                <span class="logo-text">LookUFace</span>
            </div>
            <nav class="nav-menu">
                <a href="idx.html" class="nav-item">
                    <span>实时识别</span>
                </a>
                <a href="manager.html" class="nav-item active">
                    <span>仓库管理</span>
                </a>
                <a href="console.html" class="nav-item">
                    <span>控制台</span>
                </a>
                <a href="account.html" class="nav-item">
                    <span>账号管理</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle" class="sidebar-btn">
                    <span>切换主题</span>
                </button>
                <button id="loginBtn" class="sidebar-btn">
                    <span>登录账号</span>
                </button>

            </div>
        </aside>

        <main class="main-content">
                <header class="top-bar">
                    <h1>仓库管理</h1>
                    <div class="header-actions" style="display:flex; gap:8px; flex-wrap:wrap;">
                        <button class="btn btn-outline" onclick="currentSort='default'; renderFaces(facesData);">默认</button>
                        <button class="btn btn-outline" onclick="currentSort='name'; renderFaces(facesData);">按姓名</button>
                        <button class="btn btn-outline" onclick="currentSort='online'; renderFaces(facesData);">按在线</button>
                        <button class="btn btn-outline" onclick="currentSort='duration'; renderFaces(facesData);">按时长</button>
                        <button class="btn btn-outline" onclick="exportToExcel()">导出 Excel</button>
                        <button id="refreshBtn" class="btn btn-outline">刷新</button>
                </div>
            </header>

            <div class="faces-container">
                <div class="faces-header">
                    <h3>人脸列表</h3>
                    <span class="faces-count" id="facesCount">0 条记录</span>
                </div>
                <div id="facesGrid" class="faces-grid">
                    <div class="loading-state">加载中...</div>
                </div>
            </div>
        </main>
    </div>

    <div id="previewModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>注册照片</h3>
                <button class="modal-close" onclick="closePreview()">&times;</button>
            </div>
            <div class="modal-body">
                <img id="modalImg" src="" alt="预览图">
                <div id="modalInfo" class="modal-info"></div>
            </div>
        </div>
    </div>

    <div id="authModal" class="modal auth-modal" style="display: none;">
        <div class="modal-content auth-content">
            <div class="modal-header">
                <h3 id="authTitle">登录账号</h3>
                <button class="modal-close" onclick="closeAuthModal()">&times;</button>
            </div>
            <div class="modal-body" id="authBody"></div>
        </div>
    </div>


    <div id="modifyModal" class="modal" style="display: none;">
        <div class="modal-content auth-content" style="max-width: 450px;">
            <div class="modal-header">
                <h3>修改信息</h3>
                <button class="modal-close" onclick="closeModifyModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>名字</label>
                    <input type="text" id="modifyName" class="auth-input" placeholder="输入新名字" maxlength="20">
                </div>
                <div class="form-group">
                    <label>注册时间</label>
                    <input type="datetime-local" id="modifyRegisterTime" class="auth-input">
                </div>
                <div class="form-group">
                    <label>重新上传人脸图片（可选）</label>
                    <input type="file" id="modifyImage" class="auth-input" accept="image/*">
                </div>
                <button class="btn btn-primary btn-block" onclick="confirmModify()">保存修改</button>
            </div>
        </div>
    </div>

    <div id="checkinConfirmModal" class="modal" style="display: none;">
        <div class="modal-content auth-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3>手动签到</h3>
                <button class="modal-close" onclick="closeCheckinConfirmModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p style="color: var(--text-primary); margin-bottom: 20px;">
                    确认对 <strong id="checkinTargetName"></strong> 进行手动签到？
                </p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button class="btn btn-outline" onclick="closeCheckinConfirmModal()">取消</button>
                    <button class="btn btn-primary" id="confirmCheckinBtn">确认签到</button>
                </div>
            </div>
        </div>
    </div>

    <div id="checkoutModal" class="modal" style="display: none;">
        <div class="modal-content auth-content" style="max-width: 440px;">
            <div class="modal-header">
                <h3 id="checkoutTitle">签退结算</h3>
                <button class="modal-close" onclick="closeCheckoutModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>签到时间</label>
                    <input type="text" id="checkoutCheckinTime" class="auth-input" disabled>
                </div>

                <!-- 自定义签退时间：用于事后补签退，按真实离开时间结算 -->
                <div class="form-group">
                    <label for="checkoutCustomTime">
                        签退时间
                        <span style="color: var(--text-secondary); font-weight: 400;">
                            可自定义，默认现在
                        </span>
                    </label>
                    <!-- autocomplete=off：Chrome 会把上一次的值"恢复"进
                         datetime-local 控件，覆盖掉脚本赋的新值，导致签退时间
                         变成之前某个时刻（实测造成"签退后账单全是 0"）。 -->
                    <input type="datetime-local" id="checkoutCustomTime" class="auth-input"
                           step="1" autocomplete="off">
                    <p style="color: var(--text-secondary); font-size: 12px; margin-top: 6px;"
                       id="checkoutCustomHint">
                        用于事后补签退：填真实离开时间，服务端按它精确计算金额。
                    </p>
                </div>

                <!-- 直接显示金额；时长明细放在下面的说明里 -->
                <div class="form-group">
                    <label>应付金额</label>
                    <input type="text" id="checkoutAmount" class="auth-input" disabled>
                </div>

                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="checkoutAway">
                        <span>仅标记暂离（<strong>不结算</strong>，归位后继续计时）</span>
                    </label>
                </div>

                <p id="checkoutHint" style="color: var(--text-secondary); font-size: 12px; margin-bottom: 16px;">
                    金额由服务端按上面的签退时间计算，前端不参与。
                </p>

                <div id="checkoutError"
                     style="display:none; font-size:13px; margin-bottom:14px; padding:10px 12px;
                            border-radius:10px; background:rgba(244,67,54,0.12); color:#c62828;"></div>

                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button class="btn btn-outline" onclick="closeCheckoutModal()">取消</button>
                    <button class="btn btn-primary" id="confirmCheckoutBtn">确认签退结算</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 支付弹窗：签退结算成功后弹出。
         二维码内容为占位（「开发中」），支付链接指向 pay-dev.html。 -->
    <div id="payModal" class="modal" style="display: none;">
        <div class="modal-content auth-content" style="max-width: 460px;">
            <div class="modal-header">
                <h3 id="payTitle">签退完成 · 待支付</h3>
                <button class="modal-close" onclick="closePayModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="payName" class="auth-input" disabled>
                </div>
                <div class="form-group">
                    <label>在场时间</label>
                    <input type="text" id="payElapsed" class="auth-input" disabled>
                </div>
                <div class="form-group" id="payAwayGroup" style="display: none;">
                    <label>其中暂离</label>
                    <input type="text" id="payAway" class="auth-input" disabled>
                </div>
                <div class="form-group">
                    <label>计费时长</label>
                    <input type="text" id="payMinutes" class="auth-input" disabled>
                </div>
                <div class="form-group">
                    <label>应付金额</label>
                    <input type="text" id="payAmount" class="auth-input" disabled>
                </div>

                <p id="paySummary"
                   style="color: var(--text-secondary); font-size: 13px; text-align:left;
                          margin: 4px 0 12px; line-height: 1.6;"></p>

                <!-- 二维码为占位图，内容只有「开发中」三个字，不加任何样式 -->
                <div style="text-align:center; margin: 8px 0 16px;">
                    <img id="payQrcode" alt="开发中">
                </div>

                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button class="btn btn-outline" onclick="closePayModal()">稍后支付</button>
                    <button class="btn btn-primary" id="payLinkBtn">前往支付页面</button>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="manager.js"></script>
</body>
</html>
