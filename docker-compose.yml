# ============================================================================
# LookUFace 编排
# ============================================================================

services:
  lookuface:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: lookuface:1.2.0
    container_name: lookuface
    restart: unless-stopped

    ports:
      # 宿主机端口 : 容器内端口
      - "8835:8000"

    env_file:
      - .env
    environment:
      # 容器内固定路径，覆盖 .env 里的相对路径
      DATABASE_URL: "sqlite:////app/storage/face_lens.db"
      LOG_DIR: "/app/logs"
      STORAGE_DIR: "/app/storage"
      HOST: "0.0.0.0"
      # 容器内端口固定 8000（与 ports/EXPOSE/健康检查一致）
      # 注意 .env 里若写了 ALLOWED_ORIGINS，需包含对外访问的 8835
      PORT: "8000"
      DEBUG: "False"

    volumes:
      # 数据库与截图/二维码
      - ./storage:/app/storage
      # 日志
      - ./logs:/app/logs
      # 模型只读挂载（体积大且不常变）
      - ./models:/app/models:ro

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, urllib.request, sys
          try:
              with urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=8) as r:
                  body = json.loads(r.read().decode())
              sys.exit(0 if body.get('status') == 'healthy' else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
